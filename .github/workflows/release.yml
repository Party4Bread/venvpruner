name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The crate is pure Rust with no C dependencies, so `rust-lld` links the
      # static musl binary for either architecture. No Docker and no `cross`.
      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage and verify artifact
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/venvpruner"
          test -x "$bin"
          file "$bin"
          # A dynamically linked asset would fail on any host without a matching
          # libc, so make it a hard error rather than a warning.
          if ! file "$bin" | grep -q "statically linked"; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/venvpruner-${{ matrix.target }}"

      # Actually run the binary before publishing it. aarch64 runs under qemu,
      # which catches a build that links but cannot execute.
      - name: Smoke test
        run: |
          set -euo pipefail
          bin="dist/venvpruner-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user
            run="qemu-aarch64 $bin"
          else
            run="$bin"
          fi
          mkdir -p smoke/proj/.venv
          printf 'home = /nonexistent\nversion_info = 3.12.0\n' > smoke/proj/.venv/pyvenv.cfg
          touch smoke/proj/uv.lock
          $run --version
          $run --no-tui smoke
          $run --json smoke > /dev/null
          $run --dry-run smoke

      - name: Strip
        run: |
          set -euo pipefail
          # Strip only after the smoke test, so what ran is what ships.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y -qq binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip "dist/venvpruner-${{ matrix.target }}"
          else
            strip "dist/venvpruner-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: venvpruner-${{ matrix.target }}
          path: dist/venvpruner-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Checksums
        working-directory: staging
        run: |
          set -euo pipefail
          chmod 755 venvpruner-*
          # Plain `sha256sum` text format: "<hash>  <name>". run.sh parses this.
          sha256sum venvpruner-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            staging/venvpruner-* staging/SHA256SUMS \
          || gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            staging/venvpruner-* staging/SHA256SUMS
