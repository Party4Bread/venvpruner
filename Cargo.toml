[package]
name = "venvpruner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Find and prune venvs, node_modules, target dirs and caches, hardlink-aware"
repository = "https://github.com/Party4Bread/venvpruner"
readme = "README.md"
keywords = ["disk", "cleanup", "virtualenv", "tui", "btrfs"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
humansize = "2"
ignore = "0.4"
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
