[package]
name = "venvpruner"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Find and prune venvs, node_modules, target dirs and caches, hardlink-aware"
repository = "https://github.com/Party4Bread/venvpruner"
readme = "README.md"
keywords = ["disk", "cleanup", "virtualenv", "tui", "btrfs"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
humansize = "2"
ignore = "0.4"
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# mio watches the terminal through kqueue, which on macOS rejects `/dev/tty`:
# under `curl ... | sh` run.sh hands the binary exactly that as stdin, and the
# TUI died with "Failed to initialize input reader". This feature waits on it
# without mio instead.
[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
